<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos - FastAPI</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center fw-bold text-primary">💰 Gestor de Gastos</h1>

        <div class="row g-4">
            <!-- Formulario para Agregar / Editar -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3" id="form-title">Nuevo Gasto</h4>
                    <form id="expense-form">
                        <input type="hidden" id="expense-id">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required>
                        </div>
                        <div class="mb-3">
                            <label for="cantidad" class="form-label">Cantidad ($)</label>
                            <input type="number" step="0.01" class="form-control" id="cantidad" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="categoria" required>
                        </div>
                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="btn-submit">Guardar Gasto</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancel" onclick="resetForm()">Cancelar</button>
                    </form>
                </div>
            </div>

            <!-- Tabla de Gastos -->
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Lista de Movimientos</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                ID
                                <th>Título</th>
                                <th>Cantidad</th>
                                <th>Categoría</th>
                                <th>Fecha</th>
                                <th class="text-center">Acciones</th>
                            </thead>
                            <tbody id="expenses-table-body">
                                <!-- Se llena dinámicamente con JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="script.js"></script>
</body>
</html>
